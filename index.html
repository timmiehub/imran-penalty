<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#120a2e">
<!-- v3-hub-karate -->
<title>Игры Имрана</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:#120a2e;color:#fff;font-family:ui-rounded,"SF Pro Rounded","Nunito","Segoe UI",Roboto,Arial,sans-serif;-webkit-user-select:none;user-select:none}
body{background:radial-gradient(ellipse at 50% -10%,#3a2a8a 0%,#1a1048 45%,#0b0620 100%) fixed;overflow-x:hidden}
.sky{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.sky i{position:absolute;width:3px;height:3px;border-radius:50%;background:#fff;animation:tw 2.5s ease-in-out infinite}
@keyframes tw{50%{opacity:.2;transform:scale(.6)}}
.float{position:fixed;font-size:34px;opacity:.18;animation:fl 9s linear infinite;pointer-events:none}
@keyframes fl{from{transform:translateY(110vh) rotate(0)}to{transform:translateY(-20vh) rotate(360deg)}}
main{position:relative;max-width:520px;margin:0 auto;padding:28px 18px 40px;text-align:center}
.hi{font-size:clamp(20px,5.5vw,26px);font-weight:900;opacity:.9;margin-top:4px}
h1{margin:4px 0 18px;font-size:clamp(42px,12vw,64px);font-weight:900;line-height:1;
 background:linear-gradient(180deg,#fff7b0,#ffd23f 55%,#ff9f1a);-webkit-background-clip:text;background-clip:text;color:transparent;
 filter:drop-shadow(0 4px 0 #6a2a00) drop-shadow(0 8px 16px rgba(0,0,0,.5));animation:title 3s ease-in-out infinite}
@keyframes title{50%{transform:scale(1.04) rotate(-1deg)}}
.game{display:block;text-decoration:none;color:#fff;margin:18px 0;padding:20px 18px 22px;border-radius:30px;position:relative;overflow:hidden;
 border:3px solid #ffd23f;box-shadow:0 0 0 6px rgba(255,210,63,.15),0 18px 40px rgba(0,0,0,.5),inset 0 2px 0 rgba(255,255,255,.35);transition:transform .2s;animation:in .7s cubic-bezier(.2,1.5,.4,1) both}
.game:nth-of-type(2){animation-delay:.12s}
@keyframes in{from{opacity:0;transform:translateY(40px) scale(.9)}}
.game:hover,.game:active{transform:scale(1.03)}
.fb{background:linear-gradient(160deg,#2fbf55 0%,#13853a 50%,#0a4d22 100%)}
.fb::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,rgba(255,255,255,.07) 0 30px,transparent 30px 60px)}
.kt{background:linear-gradient(160deg,#e0562a 0%,#9c2a14 50%,#4a1208 100%)}
.kt::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(255,240,200,.07) 0 2px,transparent 2px 40px),repeating-linear-gradient(90deg,rgba(255,240,200,.07) 0 2px,transparent 2px 40px)}
.game>*{position:relative}
.ic{font-size:72px;line-height:1;display:inline-block;animation:bob 1.6s ease-in-out infinite;filter:drop-shadow(0 6px 8px rgba(0,0,0,.4))}
.kt .ic{animation-delay:.4s}
@keyframes bob{50%{transform:translateY(-10px) rotate(10deg)}}
.game h2{margin:8px 0 4px;font-size:clamp(28px,8vw,36px);font-weight:900;text-shadow:0 3px 0 rgba(0,0,0,.35)}
.game p{margin:4px 0 12px;font-size:clamp(17px,4.6vw,20px);font-weight:800;opacity:.95;text-shadow:0 2px 3px rgba(0,0,0,.4)}
.prog{display:inline-block;font-weight:900;font-size:18px;background:rgba(0,0,0,.28);padding:5px 14px;border-radius:999px;margin-bottom:12px}
.play{display:inline-block;font-weight:900;font-size:clamp(28px,8vw,36px);padding:12px 44px;border-radius:999px;color:#fff;
 background:linear-gradient(180deg,#ffe066,#ffb300 55%,#e08a00);box-shadow:0 7px 0 #9a5a00,0 12px 20px rgba(0,0,0,.35),inset 0 2px 0 rgba(255,255,255,.7);text-shadow:0 3px 0 #9a5a00;animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.07)}}
.reset{margin-top:22px;font:inherit;font-weight:900;font-size:18px;color:#fff;padding:10px 22px;border-radius:999px;border:2px solid rgba(255,255,255,.45);background:rgba(255,255,255,.1);cursor:pointer}
.modal{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(5,2,20,.6);padding:20px;z-index:10}
.modal.show{display:flex}
.box{width:min(92vw,380px);padding:24px 20px;border-radius:28px;text-align:center;background:linear-gradient(170deg,#3157e0,#121f6b);border:3px solid #ffd23f;box-shadow:0 20px 50px rgba(0,0,0,.5);animation:in .4s cubic-bezier(.2,1.5,.4,1)}
.box h3{margin:6px 0 14px;font-size:26px}
.box button{display:block;width:100%;margin:10px 0;font:inherit;font-weight:900;font-size:21px;color:#fff;padding:13px;border-radius:999px;border:none;cursor:pointer}
.r1{background:linear-gradient(180deg,#2fbf55,#13853a);box-shadow:0 5px 0 #0a4d22}.r2{background:linear-gradient(180deg,#e0562a,#9c2a14);box-shadow:0 5px 0 #4a1208}
.r0{background:rgba(255,255,255,.15)!important;border:2px solid rgba(255,255,255,.4)!important}
.yes{background:linear-gradient(180deg,#ff6a5a,#d0202a);box-shadow:0 5px 0 #7a0d12}
.toast{position:fixed;left:50%;bottom:40px;transform:translateX(-50%) translateY(120px);background:#18c23e;color:#fff;font-weight:900;font-size:24px;padding:12px 30px;border-radius:999px;box-shadow:0 10px 30px rgba(0,0,0,.4);transition:transform .4s cubic-bezier(.2,1.5,.4,1);z-index:20}
.toast.show{transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<div class="sky" id="sky"></div>
<main>
 <div class="hi">Привет, Имран! 👋</div>
 <h1>Игры Имрана</h1>
 <a class="game fb" href="football.html">
  <div class="ic">⚽</div><h2>Футбол</h2><p>Дорога к Кубку: пенальти, стенка, один на один и финал!</p>
  <div class="prog" id="pf">⭐ 0 из 15</div><br><span class="play">Играть!</span>
 </a>
 <a class="game kt" href="karate.html">
  <div class="ic">🥋</div><h2>Карате-Имран</h2><p>Тренируйся с Сэнсэем, разбивай доски и выиграй турнир!</p>
  <div class="prog" id="pk">⭐ 0 из 15</div><br><span class="play">Играть!</span>
 </a>
 <button class="reset" id="resetBtn">🔄 Сброс прогресса</button>
</main>
<div class="modal" id="m1"><div class="box"><h3>Что сбросить?</h3>
 <button class="r1" data-w="fb">⚽ Футбол</button><button class="r2" data-w="kt">🥋 Карате</button><button class="r0" data-w="no">Отмена</button></div></div>
<div class="modal" id="m2"><div class="box"><h3 id="q"></h3><button class="yes" id="yes">Да, сбросить</button><button class="r0" id="no">Нет</button></div></div>
<div class="toast" id="toast">Готово! ✅</div>
<script>
"use strict";
const sky=document.getElementById('sky');for(let i=0;i<70;i++){const e=document.createElement('i');e.style.left=Math.random()*100+'%';e.style.top=Math.random()*100+'%';e.style.animationDelay=Math.random()*2.5+'s';e.style.opacity=.4+Math.random()*.6;sky.appendChild(e);}
['⚽','🥋','⭐','🏆','👊'].forEach((x,i)=>{const e=document.createElement('div');e.className='float';e.textContent=x;e.style.left=(8+i*20)+'%';e.style.animationDelay=(-i*1.8)+'s';e.style.animationDuration=(8+i)+'s';document.body.appendChild(e);});
function stars(key){try{const p=JSON.parse(localStorage.getItem(key)||'null');if(p&&Array.isArray(p.stars))return{n:p.stars.reduce((a,b)=>a+b,0),cup:!!p.cup};}catch(e){}return{n:0,cup:false};}
function refresh(){const f=stars('imranCup3'),k=stars('imranKarate1');
  document.getElementById('pf').textContent=`⭐ ${f.n} из 15${f.cup?' · 🏆':''}`;document.getElementById('pk').textContent=`⭐ ${k.n} из 15${k.cup?' · 🏆':''}`;}
refresh();
const m1=document.getElementById('m1'),m2=document.getElementById('m2');let what=null;
document.getElementById('resetBtn').onclick=()=>m1.classList.add('show');
m1.querySelectorAll('button').forEach(b=>b.onclick=()=>{m1.classList.remove('show');what=b.dataset.w;if(what==='no')return;
  document.getElementById('q').textContent=what==='fb'?'Сбросить прогресс футбола?':'Сбросить прогресс карате?';m2.classList.add('show');});
document.getElementById('no').onclick=()=>m2.classList.remove('show');
document.getElementById('yes').onclick=()=>{try{if(what==='fb'){localStorage.removeItem('imranCup3');localStorage.removeItem('imranCup2');}else localStorage.removeItem('imranKarate1');}catch(e){}
  m2.classList.remove('show');refresh();const t=document.getElementById('toast');t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1800);};
addEventListener("pageshow",refresh);if(location.hash==="#shot"){const st=document.createElement("style");st.textContent=".game{animation:none!important}";document.head.appendChild(st);}
</script>
</body>
</html>

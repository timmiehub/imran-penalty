<style>

<div class="ov" id="ov"><div class="card" id="card"></div></div>
<script>
"use strict";
// ---------- setup ----------
const W=400,H=720,HY=120,GRASS_TOP=228;
const GOAL={l:70,r:330,top:130,bot:250};
const BACK={l:89,r:311,top:168,bot:232};
const SPOT={x:200,y:497};
const IDLE={x:126,y:652}, KICKPOS={x:172,y:522};
const OL="#1a1530";
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const bg=document.createElement('canvas'),bctx=bg.getContext('2d');
let dpr=1,s=1,ox=0,oy=0,VL=0,VR=W,VT=0,VB=H,animFans=[];
function resize(){
  dpr=Math.min(window.devicePixelRatio||1,3);
  const cw=innerWidth,ch=innerHeight;
  s=Math.min(cw/W,ch/H);ox=(cw-W*s)/2;oy=(ch-H*s)/2;
  VL=-ox/s;VR=W+ox/s;VT=-oy/s;VB=H+oy/s;
  cv.width=bg.width=Math.round(cw*dpr);cv.height=bg.height=Math.round(ch*dpr);
  renderBG();
}
function world(c){c.setTransform(dpr*s,0,0,dpr*s,dpr*ox,dpr*oy);}
// seeded random for static scenery
let seed=7;function rnd(){seed=(seed*16807)%2147483647;return (seed-1)/2147483646;}
function rr(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath();}
const FONT='ui-rounded,"SF Pro Rounded","Nunito","Segoe UI",Roboto,Arial,sans-serif';

// ---------- static background ----------
function renderBG(){
  const c=bctx;seed=7;c.setTransform(1,0,0,1,0,0);c.clearRect(0,0,bg.width,bg.height);world(c);
  // sky
  let g=c.createLinearGradient(0,VT,0,120);g.addColorStop(0,'#071034');g.addColorStop(.6,'#1b2f86');g.addColorStop(1,'#4058c4');
  c.fillStyle=g;c.fillRect(VL,VT,VR-VL,130);
  for(let i=0;i<60;i++){c.fillStyle=`rgba(255,255,255,${.3+rnd()*.6})`;c.fillRect(VL+rnd()*(VR-VL),VT+rnd()*(40-VT),1.2,1.2);}
  // floodlight towers (poles)
  for(const tx of [18,382]){c.fillStyle='#2a3150';c.fillRect(tx-3,0,6,40);}
  // stand roof
  g=c.createLinearGradient(0,22,0,38);g.addColorStop(0,'#5d6688');g.addColorStop(1,'#20263f');c.fillStyle=g;c.fillRect(VL,24,VR-VL,14);
  c.fillStyle='rgba(255,255,255,.35)';c.fillRect(VL,24,VR-VL,1.5);
  // tiers
  const tiers=[{y0:38,y1:92,rows:6,sc:.8},{y0:96,y1:146,rows:5,sc:.9},{y0:150,y1:194,rows:5,sc:1}];
  const shirts=['#d4141b','#e8323a','#0a8a3a','#13a84a','#ffffff','#ffd23f','#d4141b','#0a8a3a','#ff7a1a','#2f6bff'];
  const skins=['#f6cfa8','#e9b48a','#c98b5e','#8d5a3b','#f2c29b'];
  animFans=[];
  for(const T of tiers){
    g=c.createLinearGradient(0,T.y0,0,T.y1);g.addColorStop(0,'#1c2140');g.addColorStop(1,'#2c3360');c.fillStyle=g;c.fillRect(VL,T.y0,VR-VL,T.y1-T.y0);
    const rh=(T.y1-T.y0)/T.rows,sp=8.6*T.sc;
    for(let r=0;r<T.rows;r++){
      const y=T.y0+rh*(r+.75);
      c.fillStyle='rgba(0,0,0,.25)';c.fillRect(VL,y+rh*.15,VR-VL,1);
      for(let x=VL-8+(r%2)*sp/2;x<VR+8;x+=sp){
        if(rnd()<.06)continue;
        const f={x:x+(rnd()-.5)*2,y,sc:T.sc,shirt:shirts[(rnd()*shirts.length)|0],skin:skins[(rnd()*skins.length)|0],ph:rnd()*6.28,sp:6+rnd()*6,scarf:rnd()<.2};
        if(rnd()<.2)animFans.push(f);else drawFan(c,f,0,0);
      }
    }
    c.fillStyle='#11152b';c.fillRect(VL,T.y1,VR-VL,4);c.fillStyle='rgba(255,255,255,.18)';c.fillRect(VL,T.y1,VR-VL,1);
  }
  // wall under ads
  c.fillStyle='#0d1024';c.fillRect(VL,194,VR-VL,5);
  // grass
  c.fillStyle='#2f9a3e';c.fillRect(VL,GRASS_TOP,VR-VL,VB-GRASS_TOP+5);
  const F=600;let z=F/(VB-HY);z=Math.floor(z/.42)*.42;let i=0;
  while(true){const y1=HY+F/z,y0=HY+F/(z+.42);if(y1<GRASS_TOP)break;
    const depth=Math.min(1,(y0-GRASS_TOP)/(H-GRASS_TOP));
    const a=(Math.round(z/.42))%2;
    c.fillStyle=a?`hsl(124,${50+depth*10}%,${34+depth*10}%)`:`hsl(120,${52+depth*8}%,${27+depth*8}%)`;
    c.fillRect(VL,Math.max(GRASS_TOP,y0),VR-VL,y1-Math.max(GRASS_TOP,y0)+.5);z+=.42;if(++i>200)break;}
  // converging mow stripes
  c.save();c.beginPath();c.rect(VL,GRASS_TOP,VR-VL,VB);c.clip();
  for(let X=-30;X<30;X+=1){if(((X%2)+2)%2)continue;
    c.fillStyle='rgba(255,255,255,.035)';c.beginPath();
    c.moveTo(200+X*.5*(GRASS_TOP-HY),GRASS_TOP);c.lineTo(200+(X+1)*.5*(GRASS_TOP-HY),GRASS_TOP);
    c.lineTo(200+(X+1)*.5*(VB-HY),VB);c.lineTo(200+X*.5*(VB-HY),VB);c.fill();}
  // grass texture
  for(let k=0;k<3500;k++){const y=GRASS_TOP+Math.pow(rnd(),.8)*(VB-GRASS_TOP),d=(y-HY)/500,x=VL+rnd()*(VR-VL);
    c.strokeStyle=rnd()<.5?'rgba(0,40,0,.18)':'rgba(190,255,170,.12)';c.lineWidth=.7*d+.3;c.beginPath();c.moveTo(x,y);c.lineTo(x+(rnd()-.5)*d,y-2.6*d);c.stroke();}
  c.restore();
  // lines
  c.strokeStyle='rgba(255,255,255,.92)';c.lineCap='round';
  const line=(x1,y1,x2,y2,w)=>{c.lineWidth=w;c.beginPath();c.moveTo(x1,y1);c.lineTo(x2,y2);c.stroke();};
  line(VL,250,VR,250,2);
  const X6=1.45,y6=312; line(200-X6*(250-HY),250,200-X6*(y6-HY),y6,2.4);line(200+X6*(250-HY),250,200+X6*(y6-HY),y6,2.4);
  line(200-X6*(y6-HY),y6,200+X6*(y6-HY),y6,2.6);
  const yb=640,XB=3.1; line(VL,yb,VR,yb,4.5);
  line(200-XB*(250-HY),250,200-XB*(yb-HY),yb,3);line(200+XB*(250-HY),250,200+XB*(yb-HY),yb,3);
  c.fillStyle='#fff';c.beginPath();c.ellipse(SPOT.x,SPOT.y+4,7,2.8,0,0,7);c.fill();
  // light pool + vignette
  g=c.createRadialGradient(200,430,20,200,430,360);g.addColorStop(0,'rgba(255,255,220,.13)');g.addColorStop(1,'rgba(255,255,220,0)');
  c.fillStyle=g;c.fillRect(VL,GRASS_TOP,VR-VL,VB-GRASS_TOP);
  g=c.createRadialGradient(200,360,250,200,360,Math.max(560,(VR-VL)*.75));g.addColorStop(0,'rgba(0,0,20,0)');g.addColorStop(1,'rgba(0,0,20,.45)');
  c.fillStyle=g;c.fillRect(VL,VT,VR-VL,VB-VT);
}
function drawFan(c,f,t,ex){
  const b=ex?-Math.abs(Math.sin(t*f.sp*.5+f.ph))*4*ex:Math.sin(t*2+f.ph)*.4;
  const y=f.y+b,sc=f.sc;
  if(ex>.3){c.strokeStyle=f.skin;c.lineWidth=1.6*sc;c.beginPath();c.moveTo(f.x-3*sc,y-2*sc);c.lineTo(f.x-5*sc,y-10*sc);c.moveTo(f.x+3*sc,y-2*sc);c.lineTo(f.x+5*sc,y-10*sc);c.stroke();}
  c.fillStyle=f.shirt;c.beginPath();c.arc(f.x,y,4.3*sc,Math.PI,0);c.fill();c.fillRect(f.x-4.3*sc,y,8.6*sc,3*sc);
  if(f.scarf){c.fillStyle=f.shirt==='#0a8a3a'?'#d4141b':'#0a8a3a';c.fillRect(f.x-4*sc,y-1.5*sc,8*sc,1.6*sc);}
  c.fillStyle=f.skin;c.beginPath();c.arc(f.x,y-5.4*sc,2.9*sc,0,7);c.fill();
}

// ---------- audio ----------
let AC=null,master=null,noiseBuf=null,murmur=null;
let unlocked=false;addEventListener('pointerdown',()=>{unlocked=true;},true);
function audio(){
  if(!unlocked)return null;
  if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();master=AC.createGain();master.gain.value=.8;master.connect(AC.destination);
    noiseBuf=AC.createBuffer(1,AC.sampleRate*2,AC.sampleRate);const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
    const src=AC.createBufferSource();src.buffer=noiseBuf;src.loop=true;const bp=AC.createBiquadFilter();bp.type='bandpass';bp.frequency.value=700;bp.Q.value=.6;
    murmur=AC.createGain();murmur.gain.value=.035;src.connect(bp);bp.connect(murmur);murmur.connect(master);src.start();
  }catch(e){AC=null;}}
  if(AC&&AC.state==='suspended')AC.resume();
  return AC;
}
function noise(dur,type,freq,q,vol,attack){const a=audio();if(!a)return;const n=a.currentTime,src=a.createBufferSource();src.buffer=noiseBuf;src.loop=true;
  const f=a.createBiquadFilter();f.type=type;f.frequency.value=freq;f.Q.value=q;const g=a.createGain();
  g.gain.setValueAtTime(.0001,n);g.gain.exponentialRampToValueAtTime(vol,n+attack);g.gain.exponentialRampToValueAtTime(.0001,n+dur);
  src.connect(f);f.connect(g);g.connect(master);src.start(n);src.stop(n+dur+.05);return f;}
function tone(freq,dur,type,vol,delay,glide){const a=audio();if(!a)return;const n=a.currentTime+(delay||0),o=a.createOscillator(),g=a.createGain();
  o.type=type;o.frequency.setValueAtTime(freq,n);if(glide)o.frequency.exponentialRampToValueAtTime(glide,n+dur);
  g.gain.setValueAtTime(.0001,n);g.gain.exponentialRampToValueAtTime(vol,n+.015);g.gain.exponentialRampToValueAtTime(.0001,n+dur);
  o.connect(g);g.connect(master);o.start(n);o.stop(n+dur+.05);return o;}
function sWhistle(){const a=audio();if(!a)return;[0,.32].forEach((d,i)=>{const o=tone(2750,i?.38:.18,'sine',.12,d);if(!o)return;
  const l=a.createOscillator(),lg=a.createGain();l.frequency.value=38;lg.gain.value=140;l.connect(lg);lg.connect(o.frequency);l.start(a.currentTime+d);l.stop(a.currentTime+d+.5);});}
function sKick(){tone(140,.22,'sine',.7,0,38);noise(.08,'lowpass',2500,.5,.4,.004);}
function sNet(){noise(.35,'highpass',2500,.4,.18,.01);}
function sCheer(){const f=noise(2.6,'bandpass',1100,.5,.42,.18);noise(2.2,'bandpass',2400,.8,.15,.25);
  if(murmur&&AC){const n=AC.currentTime;murmur.gain.cancelScheduledValues(n);murmur.gain.setValueAtTime(.12,n);murmur.gain.exponentialRampToValueAtTime(.035,n+4);}
  [523,659,784,1047,784,1047].forEach((fr,i)=>tone(fr,.22,'triangle',.16,.05+i*.11));}
function sOoh(){noise(1.3,'lowpass',520,.7,.3,.2);tone(330,.9,'sine',.05,.05,200);}
function sCatch(){tone(220,.12,'sine',.4,0,90);noise(.06,'lowpass',1500,.5,.25,.004);}

// ---------- campaign data ----------
const HEROES={
 ronaldo:{name:'РОНАЛДУ',num:'7',sh:['#9c0d14','#e52d36','#f0444b'],trim:'#0a8a3a',shorts:['#08592a','#11904a'],sock:'#d4141b',numc:['#fff3a0','#ffb300'],namec:'#ffd23f',hair:['#4a2c18','#1e120a'],bun:false,cheer:'СИИИУ!'},
 haaland:{name:'ХОЛАНД',num:'9',sh:['#2f7fc4','#6cb7ee','#94cdf5'],trim:'#0b2a5c',shorts:['#c9d3e2','#ffffff'],sock:'#6cb7ee',numc:['#ffffff','#dfeaff'],namec:'#ffffff',hair:['#f6dc8c','#c99a3a'],bun:true,cheer:'БУМ!'}};
const LEVELS=[
 {n:'Пенальти',icon:'⚽',hint:'Нажми в ворота, потом нажми на силу!',power:true,guess:.22},
 {n:'Свободный удар',icon:'🧱',hint:'Перебей стенку! Бей сильнее!',power:true,wall:true,guess:.19},
 {n:'Один на один',icon:'🏃',hint:'Вратарь бежит! Бей, когда круг зелёный!',rush:true,guess:.2},
 {n:'Пас и удар',icon:'🤝',hint:'Нажми на друга — пас! Потом бей в ворота!',pass:true,guess:.2},
 {n:'Финал',icon:'🏆',hint:'Финал! Вратарь самый хитрый!',power:true,guess:.32,final:true}];
const PW_LO=.22,PW_HI=.93,PW_PERIOD=2.5; // yellow<PW_LO<=green<=PW_HI<red. Green NEVER walls/overs (see snapPw + launch)
function snapPw(v){if(v<PW_LO&&v>=PW_LO-.08)return PW_LO;if(v>PW_HI&&v<=PW_HI+.05)return PW_HI;return v;}
const PASSFROM={x:86,y:590},MATE={x:52,y:640},PASSHERO={x:262,y:655},WALLX=[152,176,200,224,248],WALLY=402;
let prog={stars:[0,0,0,0,0],hero:'ronaldo',cup:false};
try{const p=JSON.parse(localStorage.getItem('imranCup3')||'null');if(p&&Array.isArray(p.stars))prog=Object.assign(prog,p);}catch(e){}
function saveProg(){try{localStorage.setItem('imranCup3',JSON.stringify(prog));}catch(e){}}
let hero=HEROES[prog.hero]?prog.hero:'ronaldo',level=0;

// ---------- game state ----------
let state='menu',kick=0,goals=0,results=[],target=null,hover=null,freeze=false,forceOut=null,cupParty=0;
let runT=0,ballP=0,rt=0,isGoal=false,saved=false,t=0,shake=0,crowdEx=.15,flashes=[],conf=[],ripple=null;
let aimT=0,outcome='',pw=0,powT=0,passT=0,runDur=.6,runFrom=IDLE;
let ball={x:SPOT.x,y:SPOT.y-2,r:15,rot:0,inNet:false},keeper={x:200,y:212,by:212,sc:1,th:0,dive:0,arm:0,adv:0,home:200},player={x:IDLE.x,y:IDLE.y,phase:0,kick:0};
function pl(n){const a=n%10,b=n%100;return n+' '+(a===1&&b!==11?'гол':a>=2&&a<=4&&(b<12||b>14)?'гола':'голов');}
const L=()=>LEVELS[level];
function resetKick(){
  const lv=L();
  state=lv.pass?'pass':'aim';target=null;runT=0;ballP=0;rt=0;isGoal=false;saved=false;ripple=null;outcome='';pw=0;powT=0;passT=0;
  ball={x:SPOT.x,y:SPOT.y-2,r:15,rot:0,inNet:false,vy:0,vx:0,held:false,loose:false,feet:false,sx:SPOT.x,sy:SPOT.y-2,ex:200,ey:200,arc:55,gy:SPOT.y};

function chooseKeeper(g){

    else keeper.aim={x:k.x-side*45,y:k.by,th:-side*.9};return;}
  let ax,ay;

    if(corner&&Math.random()<.4){ax=T.x-Math.sign(T.x-200)*48;ay=T.y+20;} else {ax=T.x+(Math.random()-.5)*10;ay=T.y+(Math.random()-.5)*10;saved=true;}}

function launch(){

  if(forceOut){outcome=forceOut==='save'?'goal':forceOut;g=forceOut==='save'?1:0;}
  if(outcome==='goal'){chooseKeeper(g);if(forceOut==='save'&&!saved){saved=true;keeper.aim={x:target.x-72*Math.sin(1.1),y:Math.min(222,target.y+72*Math.cos(1.1)),th:1.1};}if(forceOut==='goal')saved=false;if(saved)outcome='save';}

  if(outcome==='wall'){ball.ex=Math.max(WALLX[0],Math.min(WALLX[4],200+(target.x-200)*.3));ball.ey=WALLY-50;ball.arc=20;ball.gy=WALLY;}

// ---------- update ----------
function ease(x){return x<.5?2*x*x:1-Math.pow(-2*x+2,2)/2;}
function rushStep(dt){const k=keeper;k.adv=Math.min(1,k.adv+dt/2.5);k.by=k.y=212+k.adv*112;k.sc=1+k.adv*.6;k.x+=(ball.x-k.x)*dt*1.5;
  if(k.adv>=1){ball.feet=true;failed('tackle');}}
function update(dt){
  t+=dt;
  const ts=(state==='fly'&&ballP>.5&&ballP<.93&&outcome!=='wall')?.38:1; const gdt=dt*ts;
  crowdEx+=((L().final?.4:.18)-crowdEx)*dt*.35; shake*=Math.exp(-dt*7);
  if(Math.random()<dt*(2+crowdEx*30))flashes.push({x:VL+Math.random()*(VR-VL),y:40+Math.random()*150,l:.12});
  flashes=flashes.filter(f=>(f.l-=dt)>0);
  if(cupParty&&(cupParty-=dt)<=0){burst(true);cupParty=1.6;}
  conf=conf.filter(p=>(p.l-=dt)>0);
  for(const p of conf){p.vy+=420*dt;p.vx*=Math.exp(-dt*1.6);p.vy*=Math.exp(-dt*1.6);p.x+=p.vx*dt+Math.sin(t*5+p.fl)*20*dt;p.y+=p.vy*dt;p.rot+=p.vr*dt;}
  if(ripple)ripple.t+=dt;
  if(state==='menu'||state==='end'){keeper.x=200+Math.sin(t*1.5)*20;return;}
  if(state==='pass'){keeper.x=keeper.home+Math.sin(t*1.6)*15;return;}
  if(state==='passing'){passT+=dt;const k=Math.min(1,passT/.55),e=ease(k);
    ball.x=PASSFROM.x+(SPOT.x-PASSFROM.x)*e;ball.y=PASSFROM.y+(SPOT.y-2-PASSFROM.y)*e;ball.r=16.5-1.5*e;ball.rot+=dt*14;
    keeper.home+=(200-keeper.home)*dt*1.2;keeper.x=keeper.home;
    if(k>=1){state='aim';}return;}
  if(state==='aim'||state==='power'){player.phase+=dt*2;if(state==='aim')aimT+=dt;
    if(L().rush){rushStep(dt);return;}
    keeper.home+=(200-keeper.home)*dt*.8;keeper.x=keeper.home+Math.sin(t*1.6)*22;
    if(state==='power')powT+=dt;return;}
  if(state==='run'){

    player.kick=runT>runDur-.15?Math.min(1,(runT-runDur+.15)/.2):0;
    if(L().rush){rushStep(dt);if(state!=='run')return;}else keeper.x+=(200-keeper.x)*dt*4;

    else if(ballP>=1){
      if(outcome==='goal'){ball.inNet=true;ball.nx=ball.x;ball.ny=ball.y;ball.np=0;
        ball.bx=200+(target.x-200)*(BACK.r-200)/(GOAL.r-200);ball.by=BACK.top+(target.y-GOAL.top)/(GOAL.bot-GOAL.top)*(BACK.bot-BACK.top);scored();}
      else if(outcome==='over'){ball.loose=true;failed('over');}
      else if(outcome==='post'){ball.loose=true;ball.vy=-120;ball.vx=(200-ball.x)*.8;ball.gy=262;tone(1200,.3,'triangle',.25,0,900);failed('post');}
      else if(outcome==='wall'){ball.loose=true;ball.vy=-170;ball.vx=(Math.random()-.5)*140;ball.gy=WALLY+14;tone(180,.15,'sine',.4,0,80);failed('wall');}

function updKeeper(dt){

  zone(0,PW_LO,'#ffd23f');zone(PW_LO,PW_HI,'#2bd25a');zone(PW_HI,1,'#ff3b3b');
  const gl=c.createLinearGradient(x,0,x+w,0);gl.addColorStop(0,'rgba(255,255,255,.35)');gl.addColorStop(.5,'rgba(255,255,255,0)');gl.addColorStop(1,'rgba(0,0,0,.15)');c.fillStyle=gl;c.fillRect(x,y0,w,h);c.restore();
  rr(c,x,y0,w,h,12);c.strokeStyle=OL;c.lineWidth=2.5;c.stroke();
  const ny=y0+h*(1-v),pul=green&&state==='power'?1+Math.sin(t*14)*.15:1;
  c.save();c.translate(x-2,ny);c.scale(pul,pul);c.fillStyle=green?'#fff':'#ffe14d';c.strokeStyle=OL;c.lineWidth=2.5;
  c.beginPath();c.moveTo(-16,-11);c.lineTo(0,0);c.lineTo(-16,11);c.closePath();c.fill();c.stroke();c.fillRect(0,-3,w+6,6);c.strokeRect(0,-3,w+6,6);c.restore();
  if(green&&state==='power'){c.font=`900 20px ${FONT}`;c.textAlign='right';c.lineWidth=5;c.strokeStyle=OL;c.strokeText('ОТЛИЧНО!',x-22,ny+7);c.fillStyle='#5dff7a';c.fillText('ОТЛИЧНО!',x-22,ny+7);}
  c.restore();
}
function draw(){
  const c=ctx,lv=L();c.setTransform(1,0,0,1,0,0);
  const sx=(Math.random()-.5)*shake,sy=(Math.random()-.5)*shake;
  c.fillStyle='#0b1a4a';c.fillRect(0,0,cv.width,cv.height);
  c.drawImage(bg,sx*dpr*s,sy*dpr*s);
  c.setTransform(dpr*s,0,0,dpr*s,dpr*(ox+sx*s),dpr*(oy+sy*s));
  drawLights(c);
  for(const f of animFans)drawFan(c,f,t,crowdEx);
  for(const f of flashes){const g=c.createRadialGradient(f.x,f.y,0,f.x,f.y,7);g.addColorStop(0,`rgba(255,255,255,${f.l/.12})`);g.addColorStop(1,'rgba(255,255,255,0)');c.fillStyle=g;c.fillRect(f.x-7,f.y-7,14,14);}
  drawAds(c);
  drawNet(c);
  if(ball.inNet)drawBall(c,ball.x,ball.y,ball.r,ball.rot);
  drawPosts(c);
  if(lv.rush&&['aim','run'].includes(state)){const k=keeper,sweet=k.adv>=.26&&k.adv<=.78;c.save();c.lineWidth=4;c.strokeStyle=sweet?'#2bd25a':k.adv<.26?'#ffd23f':'#ff3b3b';c.shadowColor=c.strokeStyle;c.shadowBlur=12;
    c.beginPath();c.ellipse(k.x,k.by+40*k.sc,38*k.sc*(1+Math.sin(t*10)*.05),10*k.sc,0,0,7);c.stroke();c.restore();}
  const ballBehindWall=lv.wall&&(state==='fly'&&ballP>.3&&outcome!=='wall'||ball.inNet||(ball.loose&&outcome==='over'));
  const ballEarly=ball.held||ball.feet||ballBehindWall;
  drawKeeper(c);
  if(ballEarly)drawBallAll(c);
  if(lv.wall)drawWall(c);
  if(!ballEarly)drawBallAll(c);
  if(lv.pass)drawMate(c);
  drawPlayer(c);
  if(lv.pass){if(state==='pass'){const k=1+Math.sin(t*6)*.08;c.save();c.strokeStyle='#ffd23f';c.lineWidth=4;c.shadowColor='#ffd23f';c.shadowBlur=14;
    c.beginPath();c.ellipse(PASSHERO.x,PASSHERO.y+2,46*k,13*k,0,0,7);c.stroke();c.restore();
    c.save();c.translate(PASSHERO.x,PASSHERO.y-250+Math.sin(t*5)*8);c.fillStyle='#ffd23f';c.strokeStyle=OL;c.lineWidth=3;c.beginPath();c.moveTo(-14,-20);c.lineTo(14,-20);c.lineTo(0,0);c.closePath();c.fill();c.stroke();c.restore();}}
  if(state==='aim'&&!lv.rush){
    if(hover&&hover.y<330){const g=goalRect(hover.x,hover.y);drawReticle(c,g.x,g.y,false);}
    else{const hx=200+Math.sin(t*.9)*95,hy=175+Math.sin(t*1.7)*35;c.globalAlpha=.7;drawReticle(c,hx,hy,false);c.globalAlpha=1;}
  }
  if(state==='aim'&&lv.rush&&hover&&hover.y<330){const g=goalRect(hover.x,hover.y);drawReticle(c,g.x,g.y,false);}
  if(target&&['power','run','fly'].includes(state))drawReticle(c,target.x,target.y,true);
  if(lv.power&&(state==='power'||state==='run'))drawPower(c);
  const by=Math.min(VB-40,690);
  if(state==='aim'){if(lv.rush){const a=keeper.adv;banner(c,a<.26?'Жди… 👀':a<=.78?'Бей сейчас! 👆':'Скорее бей!',by,a>=.26&&a<=.78?'#2bd25a':'#ffd23f');}else banner(c,'👆 Нажми в ворота!',by);}
  if(state==='power')banner(c,'Нажми — сила! 💪',by);
  if(state==='pass')banner(c,'Нажми на '+HEROES[hero].name+' — пас!',by);
  for(const p of conf){c.save();c.translate(p.x,p.y);c.rotate(p.rot);c.scale(Math.cos(t*8+p.fl),1);c.fillStyle=p.c;c.fillRect(-p.w/2,-p.h/2,p.w,p.h);c.restore();}
  if(state==='result'){
    if(isGoal){popText(c,'ГОЛ!',200,292,96,.0,'#fff7b0','#ffb300');popText(c,'Имран забил!',200,598,42,.35,'#ffffff','#cfe8ff');
      popText(c,HEROES[hero].cheer,200,662,72,1.2,'#ff8a8a','#e8232d');}
    else{const M={save:['Вратарь поймал!',L().power&&pw<PW_LO?'Слабо! Бей сильнее!':'Ничего, ещё удар!'],over:['Слишком сильно!','Выше ворот!'],post:['Штанга!','Целься чуть ближе к центру!'],wall:['Попал в стенку!','Слабо! Бей сильнее!'],tackle:['Вратарь успел!','Бей раньше!']}[outcome]||['Мимо!',''];
      popText(c,M[0],200,600,44,.1,'#ffffff','#cfe8ff');if(kick<5)popText(c,M[1],200,658,32,.6,'#fff7b0','#ffd23f');}
  }
  if(state!=='menu')drawHUD(c);
}
// ---------- overlays / flow ----------
const ov=document.getElementById('ov'),card=document.getElementById('card');
function showOv(html){card.innerHTML=html;ov.classList.remove('show');void ov.offsetWidth;ov.classList.add('show');card.scrollTop=0;}
function hideOv(){ov.classList.remove('show');}
function starStr(n){return [0,1,2].map(i=>`<span class="${i<n?'':'off'}">★</span>`).join('');}
function preview(cnv,key){const d=Math.min(devicePixelRatio||1,3),w=120,h=170;cnv.width=w*d;cnv.height=h*d;const c=cnv.getContext('2d');c.setTransform(d,0,0,d,0,0);
  const g=c.createRadialGradient(60,150,5,60,150,70);g.addColorStop(0,'rgba(60,200,90,.6)');g.addColorStop(1,'rgba(60,200,90,0)');c.fillStyle=g;c.fillRect(0,0,w,h);
  const P=idlePose();P.armL=P.armR=.35;drawHero(c,60,160,.72,P,HEROES[key]);}
function showStart(){
  state='menu';
  showOv(`<div class="ball">⚽</div><h1>Привет, Имран!</h1><p>Выбери игрока:</p>
  <div class="heroes">${Object.keys(HEROES).map(k=>`<button class="hero ${k===hero?'sel':''}" data-h="${k}"><canvas></canvas><b>${HEROES[k].name}</b><i>№${HEROES[k].num}</i></button>`).join('')}</div>
  <button class="btn" id="go">Играть!</button>`);
  card.querySelectorAll('.hero').forEach(b=>{preview(b.querySelector('canvas'),b.dataset.h);b.onclick=()=>{audio();hero=b.dataset.h;prog.hero=hero;saveProg();
    card.querySelectorAll('.hero').forEach(x=>x.classList.toggle('sel',x===b));tone(784,.12,'triangle',.15);};});
  document.getElementById('go').onclick=()=>{audio();showMap();};
}
function isOpen(i){return i===0||prog.stars[i-1]>0;}
function showMap(){
  state='menu';
  const total=prog.stars.reduce((a,b)=>a+b,0);
  let nodes='';
  nodes+=`<button class="node cup ${prog.cup?'won':''}" data-cup="1"><span class="dot">🏆</span><span class="lbl">Кубок${prog.cup?' — твой!':''}</span></button><div class="road"></div>`;
  for(let i=4;i>=0;i--){const lv=LEVELS[i],lk=!isOpen(i),st=prog.stars[i],nx=!lk&&st===0;
    nodes+=`<button class="node ${lk?'lock':''} ${nx?'next':''} ${i%2?'r':'l'}" data-l="${i}"><span class="dot">${lk?'🔒':lv.icon}</span><span class="lbl">${i+1}. ${lv.n}<span class="st">${starStr(st)}</span></span></button>${i?'<div class="road"></div>':''}`;}
  showOv(`<h1 class="sm">Дорога к Кубку</h1><p class="sub">Звёзды: ${total} из 15 ⭐</p><div class="map">${nodes}</div>
  <button class="btn2" id="who">Игрок: ${HEROES[hero].name} 🔄</button>`);
  card.querySelectorAll('.node[data-l]').forEach(b=>b.onclick=()=>{const i=+b.dataset.l;audio();if(!isOpen(i)){tone(200,.15,'square',.08);b.classList.add('shake');setTimeout(()=>b.classList.remove('shake'),400);return;}showIntro(i);});
  card.querySelector('.node.cup').onclick=()=>{if(prog.cup)showCup();};
  document.getElementById('who').onclick=showStart;
}
function showIntro(i){
  const lv=LEVELS[i],hint=lv.pass?`Нажми на ${HEROES[hero].name} — пас! Потом бей в ворота!`:lv.hint;
  showOv(`<div class="big">${lv.icon}</div><h1 class="sm">${i+1}. ${lv.n}</h1><p>${hint}</p><p class="sub">5 ударов</p><button class="btn" id="go">Вперёд!</button>`);
  document.getElementById('go').onclick=()=>{audio();startLevel(i);};
}
function endLevel(){
  const st=goals>=4?3:goals>=2?2:1,good=goals>=3;prog.stars[level]=Math.max(prog.stars[level],st);saveProg();
  showOv(`<h1>${good?'Молодец, Имран!':'Ничего, Имран, попробуй ещё!'}</h1><p class="sub">${LEVELS[level].icon} ${LEVELS[level].n}</p>
  <div class="stars">${starStr(st)}</div><p>Ты забил ${pl(goals)} из 5</p><p class="sub">${good?HEROES[hero].cheer+' 🏆':'У тебя получится! 💪'}</p>
  <button class="btn" id="go">${level===4?'К Кубку!':'Дальше!'}</button><br><button class="btn2" id="again">Ещё раз!</button>`);
  if(good){burst(L().final);crowdEx=1;}
  document.getElementById('go').onclick=()=>{audio();if(level===4){prog.cup=true;saveProg();showCup();}else showMap();};
  document.getElementById('again').onclick=()=>{audio();startLevel(level);};
}
function showCup(){
  state='menu';cupParty=.01;crowdEx=1;sCheer();
  showOv(`<div class="cupwrap"><svg viewBox="0 0 120 130" width="170" height="184"><defs><linearGradient id="gd" x1="0" x2="1"><stop offset="0" stop-color="#b8860b"/><stop offset=".45" stop-color="#fff0a0"/><stop offset="1" stop-color="#c8960c"/></linearGradient></defs>
  <path d="M32 18H14c0 18 8 28 22 30M88 18h18c0 18-8 28-22 30" fill="none" stroke="url(#gd)" stroke-width="7" stroke-linecap="round"/>
  <path d="M30 8h60v27c0 22-13 38-30 40-17-2-30-18-30-40z" fill="url(#gd)" stroke="#5a3a00" stroke-width="3"/>
  <rect x="53" y="74" width="14" height="18" fill="url(#gd)" stroke="#5a3a00" stroke-width="3"/><rect x="34" y="92" width="52" height="12" rx="3" fill="url(#gd)" stroke="#5a3a00" stroke-width="3"/>
  <rect x="26" y="104" width="68" height="18" rx="5" fill="#3b2a12"/><text x="60" y="117" text-anchor="middle" font-size="10" font-weight="900" fill="#ffd23f">ИМРАН</text>
  <text x="60" y="47" text-anchor="middle" font-size="26" fill="#fff">★</text></svg></div>
  <h1>Кубок твой, Имран!</h1><p>Ты прошёл всю Дорогу к Кубку!</p><p class="sub">${HEROES[hero].cheer} 🎉</p><button class="btn" id="go">На карту</button>`);
  document.getElementById('go').onclick=()=>{cupParty=0;showMap();};
}
// ---------- main loop ----------
let last=performance.now();
function frame(now){const dt=Math.min(.05,(now-last)/1000);last=now;if(!freeze)update(dt);draw();requestAnimationFrame(frame);}
addEventListener('resize',resize);resize();
(function(){const h=location.hash.slice(1);
  if(!h){showStart();return;}
  Math.random=(()=>{let x=3;return()=>{x=(x*16807)%2147483647;return x/2147483647;}})();
  const sim=(cond,max)=>{for(let i=0;i<(max||4000)&&!cond();i++)update(1/60);};
  if(h==='start'){showStart();return;}
  if(h==='map'){prog.stars=[3,2,1,0,0];prog.cup=false;showMap();return;}
  if(h==='cup'){showCup();sim(()=>false,90);freeze=true;return;}
  const[n,mode]=h.split('-');const i=(+n||1)-1;startLevel(i);
  if(mode==='end'){goals=4;results=[true,true,false,true,true];kick=5;state='end';endLevel();sim(()=>false,40);freeze=true;return;}
  if(mode==='intro'){state='menu';showIntro(i);return;}
  if(L().pass){if(mode==='pass'){sim(()=>false,30);freeze=true;return;}onTap(0,0);sim(()=>state==='aim');}
  if(mode==='aim'){sim(()=>!L().rush||keeper.adv>.5,L().rush?4000:30);freeze=true;return;}
  forceOut=mode==='goal'||mode==='save'?mode:null;
  if(L().rush)sim(()=>keeper.adv>.4);
  onTap(L().wall&&mode==='wallhit'?200:290,165);
  if(state==='power'){if(mode==='power'){sim(()=>Math.abs(powVal()-.72)<.02);freeze=true;return;}
    sim(()=>Math.abs(powVal()-(mode==='wallhit'?.2:.6))<.02);onTap(0,0);}
  const stop=mode==='shot'?()=>state==='fly'&&ballP>.55:mode==='goal'?()=>state==='result'&&rt>1.45:()=>state==='result'&&rt>.8;
  sim(stop);freeze=true;
})();
requestAnimationFrame(frame);
</script>

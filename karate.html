<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#2a140a">
<!-- karate-imran v1 -->
<title>Карате-Имран</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#2a140a;touch-action:none;-webkit-user-select:none;user-select:none;overscroll-behavior:none;
 font-family:ui-rounded,"SF Pro Rounded","Nunito","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
.ov{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:16px;
 background:radial-gradient(ellipse at center,rgba(40,15,5,.1),rgba(20,8,2,.55));opacity:0;pointer-events:none;transition:opacity .4s ease}
.ov.show{opacity:1;pointer-events:auto}
.card{width:min(92vw,420px);max-height:94vh;overflow-y:auto;touch-action:pan-y;padding:26px 20px 26px;border-radius:32px;text-align:center;color:#fff;
 background:linear-gradient(170deg,#b8401f 0%,#7a2412 45%,#3d1208 100%);border:3px solid #ffd23f;
 box-shadow:0 0 0 6px rgba(255,210,63,.18),0 24px 60px rgba(0,0,0,.55),inset 0 2px 0 rgba(255,255,255,.35),inset 0 -6px 0 rgba(0,0,0,.2);
 transform:scale(.85) translateY(20px);transition:transform .5s cubic-bezier(.2,1.6,.4,1)}
.ov.show .card{transform:none}
h1{margin:8px 0 6px;font-size:clamp(32px,9.5vw,44px);font-weight:900;line-height:1.05;
 background:linear-gradient(180deg,#fff7b0,#ffd23f 55%,#ff9f1a);-webkit-background-clip:text;background-clip:text;color:transparent;
 filter:drop-shadow(0 3px 0 #5a1a00) drop-shadow(0 6px 10px rgba(0,0,0,.4))}
h1.sm{font-size:clamp(28px,8vw,38px)}
p{margin:8px 0;font-size:clamp(19px,5.4vw,24px);font-weight:800;text-shadow:0 2px 4px rgba(0,0,0,.5)}
.sub{opacity:.92;font-size:clamp(16px,4.6vw,20px)}
.big{font-size:80px;line-height:1;animation:bob 1.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-10px) rotate(8deg)}}
.btn{margin-top:16px;font:inherit;font-weight:900;font-size:clamp(32px,9vw,42px);color:#fff;padding:14px 50px;border:none;border-radius:999px;cursor:pointer;
 background:linear-gradient(180deg,#5dff7a,#18c23e 55%,#0e9a2e);box-shadow:0 8px 0 #0a6b20,0 14px 24px rgba(0,0,0,.4),inset 0 2px 0 rgba(255,255,255,.6);
 text-shadow:0 3px 0 #0a6b20;animation:pulse 1.6s ease-in-out infinite}
.btn:active{transform:translateY(6px);box-shadow:0 2px 0 #0a6b20}
@keyframes pulse{50%{transform:scale(1.06)}}
.btn2{display:inline-block;text-decoration:none;margin-top:12px;font:inherit;font-weight:900;font-size:20px;color:#fff;padding:9px 22px;border-radius:999px;border:2px solid rgba(255,255,255,.55);background:rgba(255,255,255,.12);cursor:pointer}
.stars{font-size:62px;letter-spacing:6px;margin:6px 0}
.stars span{display:inline-block;transform:scale(0);color:#ffd23f;text-shadow:0 4px 0 #b36b00,0 0 18px rgba(255,210,63,.8)}
.stars span.off{color:rgba(255,255,255,.25);text-shadow:none}
.ov.show .stars span{animation:pop .5s cubic-bezier(.2,1.8,.4,1) forwards}
.ov.show .stars span:nth-child(2){animation-delay:.25s}.ov.show .stars span:nth-child(3){animation-delay:.5s}
@keyframes pop{to{transform:scale(1)}}
.belt{display:inline-block;width:70px;height:14px;border-radius:7px;vertical-align:middle;border:2px solid #1a1530;margin-left:6px}
.map{display:flex;flex-direction:column;align-items:center;margin-top:6px}
.road{width:6px;height:14px;background:repeating-linear-gradient(#ffd23f 0 6px,transparent 6px 11px);border-radius:3px}
.node{font:inherit;color:#fff;display:flex;align-items:center;gap:12px;width:min(100%,300px);padding:8px 14px 8px 8px;border-radius:999px;cursor:pointer;
 background:linear-gradient(180deg,rgba(255,255,255,.2),rgba(255,255,255,.06));border:2px solid rgba(255,255,255,.35);text-align:left}
.node.l{transform:translateX(-14px)}.node.r{transform:translateX(14px)}
.node .dot{flex:none;width:54px;height:54px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:30px;background:radial-gradient(circle at 35% 30%,#ffb36b,#c2410c);box-shadow:inset 0 -4px 0 rgba(0,0,0,.25),0 3px 8px rgba(0,0,0,.4)}
.node .lbl{font-size:19px;font-weight:900;line-height:1.15}
.node .st{display:block;font-size:22px;letter-spacing:2px}.node .st span{color:#ffd23f}.node .st span.off{color:rgba(255,255,255,.25)}
.node.lock{opacity:.55}.node.lock .dot{background:radial-gradient(circle at 35% 30%,#aab,#556)}
.node.next{border-color:#ffd23f;animation:glow 1.2s ease-in-out infinite}
@keyframes glow{50%{box-shadow:0 0 22px rgba(255,210,63,.85)}}
.node.cup .dot{background:radial-gradient(circle at 35% 30%,#fff3a0,#c8960c);filter:grayscale(1);opacity:.7}
.node.cup.won .dot{filter:none;opacity:1;animation:glow 1.2s infinite}
.node.shake{animation:shk .35s}@keyframes shk{25%{margin-left:-12px}75%{margin-left:12px}}
.cupwrap svg{filter:drop-shadow(0 0 24px rgba(255,210,63,.8));animation:bob 1.6s ease-in-out infinite}
#back{position:fixed;left:10px;bottom:10px;z-index:5;font:inherit;font-weight:900;font-size:16px;color:#fff;padding:8px 14px;border-radius:999px;border:2px solid rgba(255,255,255,.5);background:rgba(30,10,4,.7);display:none}
</style>
</head>
<body>
<canvas id="c"></canvas>
<button id="back">← Карта</button>
<div class="ov" id="ov"><div class="card" id="card"></div></div>
<script>
"use strict";
const W=400,H=720,FLOOR=585,OL="#1a1020";
const FONT='ui-rounded,"SF Pro Rounded","Nunito","Segoe UI",Roboto,Arial,sans-serif';
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const bg=document.createElement('canvas'),bctx=bg.getContext('2d');
let dpr=1,s=1,ox=0,oy=0,VL=0,VR=W,VT=0,VB=H,bgLevel=-1;
function resize(){dpr=Math.min(devicePixelRatio||1,3);const cw=innerWidth,ch=innerHeight;s=Math.min(cw/W,ch/H);ox=(cw-W*s)/2;oy=(ch-H*s)/2;
  VL=-ox/s;VR=W+ox/s;VT=-oy/s;VB=H+oy/s;cv.width=bg.width=Math.round(cw*dpr);cv.height=bg.height=Math.round(ch*dpr);renderBG();}
function world(c){c.setTransform(dpr*s,0,0,dpr*s,dpr*ox,dpr*oy);}
let seed=11;function rnd(){seed=(seed*16807)%2147483647;return(seed-1)/2147483646;}
function rr(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath();}
function limb(c,pts,w,col){c.lineCap='round';c.lineJoin='round';c.beginPath();c.moveTo(pts[0],pts[1]);for(let i=2;i<pts.length;i+=2)c.lineTo(pts[i],pts[i+1]);
  c.strokeStyle=OL;c.lineWidth=w+3.2;c.stroke();c.strokeStyle=col;c.lineWidth=w;c.stroke();}
function circ(c,x,y,r,fill,ol){c.beginPath();c.arc(x,y,r,0,7);c.fillStyle=fill;c.fill();if(ol!==false){c.strokeStyle=OL;c.lineWidth=2.2;c.stroke();}}

// ---------- data ----------
const LEVELS=[
 {n:'Тренировка ударов',icon:'👊',hint:'Бей по светящейся лапе, пока она горит!',type:'pads',N:8},
 {n:'Блоки',icon:'🛡️',hint:'Сэнсэй замахивается! Смотри на стрелку и жми ВВЕРХ или ВНИЗ!',type:'block',N:8},
 {n:'Разбей доски',icon:'🪵',hint:'Держи палец — копи силу. Отпусти на зелёном!',type:'boards',N:5},
 {n:'Спарринг',icon:'🥋',hint:'Зелёный свет — бей! Красный — ставь блок!',type:'spar',N:8,opp:'kid'},
 {n:'Финал турнира',icon:'🏆',hint:'Финал! Зелёный — бей, красный — блок!',type:'spar',N:10,opp:'boss',final:true}];
const BELTS=[['Белый','#f4f4f0'],['Жёлтый','#ffd23f'],['Оранжевый','#ff8a1a'],['Зелёный','#2bb24c'],['Синий','#2f6bff'],['Чёрный','#1d1d22']];
let prog={stars:[0,0,0,0,0],cup:false};
try{const p=JSON.parse(localStorage.getItem('imranKarate1')||'null');if(p&&Array.isArray(p.stars))prog=Object.assign(prog,p);}catch(e){}
function saveProg(){try{localStorage.setItem('imranKarate1',JSON.stringify(prog));}catch(e){}}
function beltIdx(){if(prog.cup)return 5;return Math.min(4,Math.floor(prog.stars.reduce((a,b)=>a+b,0)/3));}
function nOf(n,a,b,c){const m=n%10,h=n%100;return n+' '+(m===1&&h!==11?a:m>=2&&m<=4&&(h<12||h>14)?b:c);}

// ---------- background ----------
function renderBG(){
  const lv=state==='menu'?-1:level;bgLevel=lv;const c=bctx;seed=11;c.setTransform(1,0,0,1,0,0);c.clearRect(0,0,bg.width,bg.height);world(c);
  let g=c.createLinearGradient(0,VT,0,420);g.addColorStop(0,'#2a1408');g.addColorStop(1,'#4a2812');c.fillStyle=g;c.fillRect(VL,VT,VR-VL,430-VT);
  // shoji wall
  const pw=96,x0=Math.floor((VL-40)/pw)*pw+8;
  for(let x=x0;x<VR+pw;x+=pw){
    const pg=c.createLinearGradient(0,96,0,410);pg.addColorStop(0,'#fff6dc');pg.addColorStop(.6,'#f6dfb0');pg.addColorStop(1,'#e9c98e');
    c.fillStyle=pg;c.fillRect(x,96,pw-8,314);
    const glow=c.createRadialGradient(x+pw/2,250,10,x+pw/2,250,140);glow.addColorStop(0,'rgba(255,200,120,.35)');glow.addColorStop(1,'rgba(255,200,120,0)');c.fillStyle=glow;c.fillRect(x,96,pw-8,314);
    c.strokeStyle='#5b3418';c.lineWidth=2.2;
    for(let i=1;i<3;i++){c.beginPath();c.moveTo(x+(pw-8)*i/3,96);c.lineTo(x+(pw-8)*i/3,410);c.stroke();}
    for(let j=1;j<5;j++){c.beginPath();c.moveTo(x,96+314*j/5);c.lineTo(x+pw-8,96+314*j/5);c.stroke();}
    c.fillStyle='#3b2010';c.fillRect(x-8,90,8,326);
  }
  // beams
  g=c.createLinearGradient(0,62,0,98);g.addColorStop(0,'#6b3e1c');g.addColorStop(1,'#3b2010');c.fillStyle=g;c.fillRect(VL,62,VR-VL,36);
  c.fillStyle='rgba(255,220,160,.25)';c.fillRect(VL,62,VR-VL,2);
  c.fillStyle='#2a1408';c.fillRect(VL,VT,VR-VL,62-VT);
  // scroll
  if(lv<3){c.fillStyle='#3b2010';c.fillRect(198,100,4,10);rr(c,166,108,68,190,6);c.fillStyle='#fbf3df';c.fill();c.strokeStyle='#7a4a22';c.lineWidth=3;c.stroke();
    c.fillStyle='#5b3418';c.fillRect(160,104,80,8);c.fillRect(160,294,80,8);
    c.strokeStyle='#c4281c';c.lineWidth=7;c.lineCap='round';c.beginPath();c.arc(200,170,24,-1.2,4.6);c.stroke();
    c.fillStyle='#2a1408';c.font=`900 20px ${FONT}`;c.textAlign='center';c.fillText('СИЛА',200,240);c.fillText('ДУХА',200,266);}
  // tournament decor
  if(lv>=3){
    c.fillStyle=lv===4?'#c4281c':'#2f6bff';rr(c,90,104,220,44,10);c.fill();c.strokeStyle='#ffd23f';c.lineWidth=3;c.stroke();
    c.fillStyle='#fff';c.font=`900 24px ${FONT}`;c.textAlign='center';c.fillText(lv===4?'ФИНАЛ ТУРНИРА':'СПАРРИНГ',200,134);
    for(let x=VL;x<VR;x+=28){c.fillStyle=['#c4281c','#fff','#ffd23f'][Math.abs(Math.round(x/28))%3];c.beginPath();c.moveTo(x,64);c.lineTo(x+24,64);c.lineTo(x+12,86);c.closePath();c.fill();}
    // audience
    for(let row=0;row<3;row++)for(let x=VL-10+(row%2)*11;x<VR+10;x+=22){const y=330+row*26,cl=['#c4281c','#2f6bff','#ffd23f','#2bb24c','#fff','#ff8a1a'][Math.floor(rnd()*6)];
      c.fillStyle='rgba(30,15,8,.9)';c.beginPath();c.arc(x,y,9,Math.PI,0);c.fill();c.fillRect(x-9,y,18,40);
      c.fillStyle=cl;c.beginPath();c.arc(x,y+6,8,Math.PI,0);c.fill();c.fillStyle='#e9b48a';c.beginPath();c.arc(x,y-8,6,0,7);c.fill();c.fillStyle='#2a1408';c.beginPath();c.arc(x,y-10,6,Math.PI,0);c.fill();}
  }
  // baseboard
  c.fillStyle='#2a1408';c.fillRect(VL,410,VR-VL,12);
  // floor planks perspective
  g=c.createLinearGradient(0,420,0,VB);g.addColorStop(0,'#9a5e2c');g.addColorStop(.4,'#c88a4c');g.addColorStop(1,'#a8693a');c.fillStyle=g;c.fillRect(VL,420,VR-VL,VB-420);
  const VPy=120;c.strokeStyle='rgba(70,35,10,.35)';c.lineWidth=1.4;
  for(let k=-40;k<=40;k++){const xb=200+k*58;c.beginPath();c.moveTo(200+(xb-200)*(420-VPy)/(VB-VPy),420);c.lineTo(xb,VB);c.stroke();}
  for(let k=0;k<60;k++){const y=430+Math.pow(rnd(),.8)*(VB-430),xx=VL+rnd()*(VR-VL),len=20*(y-VPy)/300;c.strokeStyle='rgba(70,35,10,.25)';c.beginPath();c.moveTo(xx,y);c.lineTo(xx+len,y);c.stroke();}
  for(let k=0;k<500;k++){const y=422+rnd()*(VB-422),xx=VL+rnd()*(VR-VL);c.fillStyle=rnd()<.5?'rgba(255,230,190,.08)':'rgba(60,30,10,.08)';c.fillRect(xx,y,6+rnd()*14,1);}
  // tatami
  const tq=(y,X)=>200+X*(y-VPy);
  c.beginPath();c.moveTo(tq(470,-.62),470);c.lineTo(tq(470,.62),470);c.lineTo(tq(VB,.62),VB);c.lineTo(tq(VB,-.62),VB);c.closePath();
  g=c.createLinearGradient(0,470,0,VB);g.addColorStop(0,'#cfc27a');g.addColorStop(1,'#e2d690');c.fillStyle=g;c.fill();c.strokeStyle='#2f5a3a';c.lineWidth=7;c.stroke();
  c.strokeStyle='rgba(120,100,40,.25)';c.lineWidth=1;for(let y=476;y<VB;y+=5){c.beginPath();c.moveTo(tq(y,-.6),y);c.lineTo(tq(y,.6),y);c.stroke();}
  c.strokeStyle='rgba(47,90,58,.7)';c.lineWidth=3;c.beginPath();c.moveTo(200,470);c.lineTo(200,VB);c.stroke();
  // light pool + vignette
  g=c.createRadialGradient(200,520,20,200,520,320);g.addColorStop(0,'rgba(255,220,150,.22)');g.addColorStop(1,'rgba(255,220,150,0)');c.fillStyle=g;c.fillRect(VL,300,VR-VL,VB-300);
  g=c.createRadialGradient(200,380,240,200,380,Math.max(560,(VR-VL)*.75));g.addColorStop(0,'rgba(20,5,0,0)');g.addColorStop(1,'rgba(20,5,0,.55)');c.fillStyle=g;c.fillRect(VL,VT,VR-VL,VB-VT);
}

// ---------- audio ----------
let AC=null,master=null,noiseBuf=null,unlocked=false;addEventListener('pointerdown',()=>{unlocked=true;},true);
function audio(){if(!unlocked)return null;if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)();master=AC.createGain();master.gain.value=.8;master.connect(AC.destination);
  noiseBuf=AC.createBuffer(1,AC.sampleRate*2,AC.sampleRate);const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;}catch(e){AC=null;}}
  if(AC&&AC.state==='suspended')AC.resume();return AC;}
function noise(dur,type,freq,q,vol,attack,f2){const a=audio();if(!a)return;const n=a.currentTime,src=a.createBufferSource();src.buffer=noiseBuf;src.loop=true;
  const f=a.createBiquadFilter();f.type=type;f.frequency.setValueAtTime(freq,n);if(f2)f.frequency.exponentialRampToValueAtTime(f2,n+dur);f.Q.value=q;const g=a.createGain();
  g.gain.setValueAtTime(.0001,n);g.gain.exponentialRampToValueAtTime(vol,n+attack);g.gain.exponentialRampToValueAtTime(.0001,n+dur);src.connect(f);f.connect(g);g.connect(master);src.start(n);src.stop(n+dur+.05);}
function tone(freq,dur,type,vol,delay,glide){const a=audio();if(!a)return;const n=a.currentTime+(delay||0),o=a.createOscillator(),g=a.createGain();
  o.type=type;o.frequency.setValueAtTime(freq,n);if(glide)o.frequency.exponentialRampToValueAtTime(glide,n+dur);
  g.gain.setValueAtTime(.0001,n);g.gain.exponentialRampToValueAtTime(vol,n+.012);g.gain.exponentialRampToValueAtTime(.0001,n+dur);o.connect(g);g.connect(master);o.start(n);o.stop(n+dur+.05);}
const sWhoosh=()=>noise(.2,'bandpass',500,1.2,.35,.05,2400);
const sHit=()=>{tone(110,.22,'sine',.7,0,40);noise(.1,'lowpass',1800,.6,.45,.004);};
const sClack=()=>{tone(950,.07,'square',.12);noise(.07,'highpass',2500,.6,.3,.003);};
const sCrack=()=>{noise(.45,'lowpass',1400,.5,.6,.004);tone(140,.3,'sine',.5,0,45);noise(.25,'highpass',3000,.5,.2,.01);};
const sGong=()=>{[110,165.5,221,331].forEach((f,i)=>tone(f,2.4,'sine',.18/(i+1)));};
const sDing=()=>{tone(1320,.5,'triangle',.18);tone(1980,.4,'sine',.08,.02);};
const sYay=()=>{[523,659,784,1047].forEach((f,i)=>tone(f,.2,'triangle',.16,i*.1));noise(1.8,'bandpass',1100,.5,.25,.15);};
const sOuch=()=>tone(320,.25,'sine',.15,0,170);

// ---------- characters ----------
const BASE={lean:.06,tilt:0,fsh:.95,fel:1.55,bsh:.45,bel:1.9,fhp:.42,fkn:-.42,bhp:-.38,bkn:.15,bx:0,jump:0};
const POSES={
 stance:{},
 idle:{lean:0,fsh:.15,fel:.35,bsh:-.12,bel:.35,fhp:.14,fkn:-.06,bhp:-.14,bkn:.06},
 bow:{lean:.55,tilt:.25,fsh:.08,fel:0,bsh:.08,bel:0,fhp:.1,fkn:0,bhp:-.1,bkn:0},
 punch:{lean:.24,fsh:1.57,fel:.04,bsh:.15,bel:2.2,fhp:.62,fkn:-.55,bhp:-.62,bkn:.1,bx:16},
 punchHi:{lean:.18,fsh:1.85,fel:.02,bsh:.15,bel:2.2,fhp:.6,fkn:-.55,bhp:-.6,bkn:.1,bx:14},
 kick:{lean:-.3,fsh:.85,fel:1.8,bsh:.3,bel:2,fhp:1.62,fkn:-.08,bhp:-.12,bkn:.04,bx:4},
 blockHi:{lean:-.06,fsh:2.55,fel:-.95,bsh:.5,bel:1.9},
 blockLo:{lean:.08,fsh:.55,fel:-.1,bsh:.5,bel:1.9,fhp:.5,fkn:-.6},
 hurt:{lean:-.38,tilt:-.25,fsh:.35,fel:.7,bsh:-.45,bel:.7,bx:-14},
 charge:{lean:-.12,fsh:2.9,fel:.35,bsh:.4,bel:1.9,fhp:.5,fkn:-.5,bhp:-.45,bkn:.15},
 chop:{lean:.42,fsh:1.05,fel:.02,bsh:-.3,bel:1.6,fhp:.62,fkn:-.62,bhp:-.6,bkn:.15,bx:6},
 victory:{lean:0,fsh:2.85,fel:.25,bsh:2.85,bel:.25,fhp:.25,fkn:-.1,bhp:-.25,bkn:.1},
 pads:{lean:-.04,fsh:1.4,fel:.55,bsh:.95,bel:.2},
 padsHit:{lean:-.16,fsh:1.25,fel:.75,bsh:.8,bel:.35,bx:-7},
 windHi:{lean:-.22,fsh:2.6,fel:1.1,bsh:.4,bel:1.9,bx:-4},
 windLo:{lean:-.25,fsh:.9,fel:1.7,bsh:.3,bel:2,fhp:-.5,fkn:.6,bx:-4},
 strikeHi:{lean:.25,fsh:1.75,fel:.02,bsh:.1,bel:2.2,fhp:.62,fkn:-.55,bhp:-.62,bkn:.1,bx:30},
 strikeLo:{lean:-.28,fsh:.85,fel:1.8,bsh:.3,bel:2,fhp:1.4,fkn:-.05,bhp:-.12,bkn:.04,bx:22},
 open:{lean:-.08,fsh:.25,fel:.4,bsh:.1,bel:.4},
 clap:{lean:.02,fsh:1.35,fel:.9,bsh:1.3,bel:1.0,fhp:.14,fkn:-.06,bhp:-.14,bkn:.06}};
const KEYS=Object.keys(BASE);
function P(n){return Object.assign({},BASE,POSES[n]||{});}
const LOOKS={
 imran:{gi:'#fbfbf7',sh:'#d5dae6',skin:'#f6cfa8',hair:'#2a180c',band:'#e3262f',kid:true},
 sensei:{gi:'#f2ece0',sh:'#cfc6b4',skin:'#e9b48a',hair:'#d9d9d9',beard:true,belt:'#1d1d22',bald:true},
 kid:{gi:'#3d7be0',sh:'#2a59ad',skin:'#e9b48a',hair:'#5a3410',band:'#ffffff',kid:true,belt:'#2bb24c'},

      G.phase=kind;G.pt=0;G.W=kind==='open'?(fin?1.15:1.4):(fin?1.1:1.35);

    else if(G.phase==='open'&&G.pt>G.W){setPose(opp,'stance',.2);finishRound(false,'Не успел!','Зелёный — жми УДАР!');}
    else if(G.phase==='hitting'&&G.pt>.08){const J=joints(opp.pose),hp=wpt(opp,J.Hd);sHit();shake=8;opp.flash=.3;setPose(opp,'hurt',.1,'ouch');burst(hp.x,hp.y,20,['#fff','#ffd23f','#ff9f1a'],280);finishRound(true,Math.random()<.5?'Попал!':'КИЯ!');}
    else if(G.phase==='attack'&&G.pt>G.W){setPose(opp,'strikeHi',.08);G.phase='strike';G.pt=0;}
    else if(G.phase==='strike'&&G.pt>.08){const J=joints(imran.pose),hp=wpt(imran,J.Hd);
      if(G.choice==='block'){sClack();burst(hp.x+20,hp.y,16,['#9be7ff','#fff','#2f9bff'],220);finishRound(true,'Блок!');}
      else{sHit();sOuch();shake=8;imran.flash=.4;setPose(imran,'hurt',.1,'ouch');finishRound(false,'Ой!','Красный — жми БЛОК!');}}
  }
}
function update(dt){
  t+=dt;shake*=Math.exp(-dt*8);
  updChar(imran,dt);if(opp)updChar(opp,dt);if(sensei)updChar(sensei,dt);
  for(const m of motes){m.y-=m.v*dt;m.x+=Math.sin(t+m.ph)*6*dt;if(m.y<60){m.y=600;m.x=Math.random()*400;}}
  parts=parts.filter(p=>(p.l-=dt)>0);for(const p of parts){if(p.type==='conf'){p.vy+=420*dt;p.vx*=Math.exp(-dt*1.6);p.vy*=Math.exp(-dt*1.6);}else if(p.type==='chip'){p.vy+=600*dt;}else{p.vx*=Math.exp(-dt*4);p.vy*=Math.exp(-dt*4);}p.x+=p.vx*dt;p.y+=p.vy*dt;p.rot+=p.vr*dt;}
  texts=texts.filter(x=>t-x.t0<x.life);
  if(cupParty&&(cupParty-=dt)<=0){confetti();cupParty=1.8;}
  if(state==='play'&&G)updateLevel(dt);
  if(state==='menu'||state==='end'){if(imran.k>=1&&Math.random()<dt*.35){const a=['punch','kick','stance','bow','stance'][Math.floor(Math.random()*5)];setPose(imran,a,a==='punch'||a==='kick'?.1:.4,a==='bow'?'happy':'focus');if(a!=='stance')setTimeout(()=>setPose(imran,'stance',.3,'focus'),600);}}
}

function starStr(n){return[0,1,2].map(i=>`<span class="${i<n?'':'off'}">★</span>`).join('');}
function toMenuScene(){state='menu';G=null;document.getElementById('back').style.display='none';imran=mkChar(LOOKS.imran,128,1,1.45);opp=mkChar(LOOKS.sensei,282,-1,1.45);setPose(opp,'idle',.3,'happy');sensei=null;}

function showStart(){toMenuScene();
  showOv(`<div class="big">🥋</div><h1>Привет, Имран!</h1><p>Это <b>Карате-Имран</b>!</p><p class="sub">Тренируйся с Сэнсэем и выиграй турнир!</p><p class="sub">${beltHtml()}</p>
  <button class="btn" id="go">Начать!</button><br><a class="btn2" href="index.html">← Меню</a>`);
  document.getElementById('go').onclick=()=>{audio();sGong();showMap();};}
function isOpen(i){return i===0||prog.stars[i-1]>0;}
function showMap(){toMenuScene();const total=prog.stars.reduce((a,b)=>a+b,0);
  let nodes=`<button class="node cup ${prog.cup?'won':''}"><span class="dot">🏆</span><span class="lbl">Кубок${prog.cup?' — твой!':''}</span></button><div class="road"></div>`;
  for(let i=4;i>=0;i--){const lv=LEVELS[i],lk=!isOpen(i),st=prog.stars[i];nodes+=`<button class="node ${lk?'lock':''} ${!lk&&!st?'next':''} ${i%2?'r':'l'}" data-l="${i}"><span class="dot">${lk?'🔒':lv.icon}</span><span class="lbl">${i+1}. ${lv.n}<span class="st">${starStr(st)}</span></span></button>${i?'<div class="road"></div>':''}`;}
  showOv(`<h1 class="sm">Путь каратиста</h1><p class="sub">Звёзды: ${total} из 15 ⭐ · ${beltHtml()}</p><div class="map">${nodes}</div><a class="btn2" href="index.html">← Меню</a>`);
  card.querySelectorAll('.node[data-l]').forEach(b=>b.onclick=()=>{const i=+b.dataset.l;audio();if(!isOpen(i)){tone(200,.15,'square',.08);b.classList.add('shake');setTimeout(()=>b.classList.remove('shake'),400);return;}showIntro(i);});

function showIntro(i){const lv=LEVELS[i];showOv(`<div class="big">${lv.icon}</div><h1 class="sm">${i+1}. ${lv.n}</h1><p>${lv.hint}</p><p class="sub">${lv.N} ${lv.type==='boards'?'попыток':'заданий'}</p><button class="btn" id="go">Вперёд!</button>`);
  document.getElementById('go').onclick=()=>{audio();startLevel(i);};}
function endLevel(){const ok=G.res.filter(Boolean).length,N=G.lv.N,r=ok/N,st=r>=.75?3:r>=.4?2:1,good=r>=.5;
  prog.stars[level]=Math.max(prog.stars[level],st);saveProg();document.getElementById('back').style.display='none';
  setPose(imran,good?'victory':'bow',.3,'happy');if(good){confetti();sYay();}
  showOv(`<h1>${good?'Молодец, Имран!':'Ничего, Имран, ещё раз!'}</h1><p class="sub">${G.lv.icon} ${G.lv.n}</p><div class="stars">${starStr(st)}</div>
  <p>${ok} из ${N} — ${good?'КИЯ! 🥋':'У тебя получится! 💪'}</p><button class="btn" id="go">${level===4?'К Кубку!':'Дальше!'}</button><br><button class="btn2" id="again">Ещё раз!</button>`);
  document.getElementById('go').onclick=()=>{audio();if(level===4){prog.cup=true;saveProg();showCup();}else showMap();};
  document.getElementById('again').onclick=()=>{audio();startLevel(level);};}
function showCup(){toMenuScene();setPose(imran,'victory',.3,'happy');cupParty=.01;sYay();sGong();
  showOv(`<div class="cupwrap"><svg viewBox="0 0 120 130" width="170" height="184"><defs><linearGradient id="gd" x1="0" x2="1"><stop offset="0" stop-color="#b8860b"/><stop offset=".45" stop-color="#fff0a0"/><stop offset="1" stop-color="#c8960c"/></linearGradient></defs>
  <path d="M32 18H14c0 18 8 28 22 30M88 18h18c0 18-8 28-22 30" fill="none" stroke="url(#gd)" stroke-width="7" stroke-linecap="round"/>
  <path d="M30 8h60v27c0 22-13 38-30 40-17-2-30-18-30-40z" fill="url(#gd)" stroke="#5a3a00" stroke-width="3"/>
  <rect x="53" y="74" width="14" height="18" fill="url(#gd)" stroke="#5a3a00" stroke-width="3"/><rect x="34" y="92" width="52" height="12" rx="3" fill="url(#gd)" stroke="#5a3a00" stroke-width="3"/>
  <rect x="18" y="104" width="84" height="18" rx="5" fill="#3b2a12"/><text x="60" y="117" text-anchor="middle" font-size="9" font-weight="900" fill="#ffd23f">КАРАТЕ-ИМРАН</text>
  <text x="60" y="47" text-anchor="middle" font-size="26" fill="#fff">🥋</text></svg></div>
  <h1>Ты чемпион, Имран!</h1><p>Кубок «Карате-Имран» твой!</p><p class="sub">${beltHtml()} 🎉</p><button class="btn" id="go">На карту</button>`);
  document.getElementById('go').onclick=()=>{cupParty=0;showMap();};}
document.getElementById('back').onclick=()=>{showMap();};
// ---------- loop ----------
let last=performance.now();
function frame(now){const dt=Math.min(.05,(now-last)/1000);last=now;if(!freeze)update(dt);draw();requestAnimationFrame(frame);}
addEventListener('resize',resize);resize();
(function(){const h=location.hash.slice(1);if(!h){showStart();return;}
  Math.random=(()=>{let x=5;return()=>{x=(x*16807)%2147483647;return x/2147483647;}})();
  const sim=(cond,max)=>{for(let i=0;i<(max||3000)&&!cond();i++)update(1/60);};
  if(h==='start'){showStart();sim(()=>false,20);return;}
  if(h==='map'){prog.stars=[3,2,0,0,0];showMap();return;}
  if(h==='cup'){showCup();sim(()=>false,80);freeze=true;return;}
  const[n,mode]=h.split('-');const i=(+n||1)-1;startLevel(i);const ty=LEVELS[i].type;
  sim(()=>G.phase!=='intro');
  if(ty==='pads'){sim(()=>G.phase==='lit');sim(()=>G.pt>.4);if(mode==='hit'){const p=padPos(G.side);tapPad(p.x,p.y);sim(()=>G.phase==='after'&&G.pt>.15);}}
  if(ty==='block'){sim(()=>G.phase==='wind');sim(()=>G.pt>.5);if(mode==='hit'){chooseBlock(G.side);sim(()=>G.phase==='after'&&G.pt>.1);}}
  if(ty==='boards'){G.round=4;G.res=[true,true,false,true];sim(()=>G.phase==='ready');if(mode==='charge'){G.phase='charge';G.pt=0;setPose(imran,'charge',.25);sim(()=>G.pt>.75);}
    if(mode==='hit'){G.phase='charge';G.pt=0;setPose(imran,'charge',.25);sim(()=>G.pt>.75);releaseChop();sim(()=>G.phase==='after'&&G.pt>.35);}}
  if(ty==='spar'){sim(()=>G.phase==='open'||G.phase==='attack');sim(()=>G.pt>.4);if(mode==='hit'){G.pressed={id:1,t};if(G.phase==='open')sparInput('punch');else sparInput('block');sim(()=>G.phase==='after'&&G.pt>.12);}}
  freeze=true;
})();
requestAnimationFrame(frame);
</script>
</body>
</html>
